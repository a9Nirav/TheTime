<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Thetimelesshuesstudio</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
        <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container">
      <img src="img/nirav_vadhiya_img.jpeg" alt="" class="img-fluid" style="height: 200px; width: 200px;">
        
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

        <script>
            // Initialize Plyr
            const player = new Plyr('#player', {
                controls: [
                    'play-large', // Large play button
                    'play',       // Play/pause button
                    'progress',   // Progress bar
                    'current-time', // Current time
                    'mute',       // Mute button
                    'volume',     // Volume control
                    'settings',   // Settings icon
                    'fullscreen'  // Fullscreen toggle
                ],
                settings: ['quality'], // Add quality to settings
                quality: {
                    default: 720, // Default quality
                    options: [720, 480], // Available quality options
                    forced: true, // Forces manual quality switching
                    onChange: (quality) => console.log(`Quality changed to: ${quality}p`)
                }
            });
        </script>
           <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
